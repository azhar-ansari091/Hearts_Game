<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearts Game</title>
<meta name="theme-color" content="#0A0812">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hearts">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%237C3AED'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle'%3E%E2%99%A5%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  min-height:100vh;
  font-family:system-ui,-apple-system,sans-serif;
  color:#F0EEFF;
  background:
    radial-gradient(ellipse 80% 60% at 0% 100%, #2563EB 0%, transparent 60%),
    radial-gradient(ellipse 70% 50% at 100% 100%, #9333EA 0%, transparent 55%),
    radial-gradient(ellipse 60% 40% at 50% 90%, #7C3AED 0%, transparent 50%),
    #050408;
  background-attachment:fixed;
}
.wrap{max-width:420px;margin:0 auto;padding:0 16px 80px;position:relative;z-index:1}
#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:50}
.screen{display:none;padding-top:20px}
.screen.active{display:block}

.app-header{display:flex;align-items:center;justify-content:center;gap:10px;padding:20px 0 16px}
.app-icon{
  width:40px;height:40px;border-radius:12px;background:#7C3AED;
  display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;
  animation:spinY 3s linear infinite;
}
@keyframes spinY{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
.app-title{font-size:22px;font-weight:700;color:#F0EEFF}
@media (prefers-reduced-motion:reduce){.app-icon{animation:none}}

h2{font-size:18px;font-weight:600;text-align:center;margin-bottom:6px;color:#F0EEFF}
.sub{font-size:14px;color:#A99DC8;text-align:center;margin-bottom:20px}

input[type=number],input[type=text]{
  display:block;width:100%;margin-bottom:12px;
  font-size:16px;padding:13px 16px;border-radius:12px;outline:none;
  background:rgba(255,255,255,.13);
  border:1.5px solid rgba(167,139,250,.45);
  color:#F0EEFF;transition:border-color .2s,box-shadow .2s;
}
input::placeholder{color:rgba(255,255,255,.38)}
input:focus{border-color:#A78BFA;box-shadow:0 0 0 3px rgba(139,92,246,.28)}

button.btn-primary{
  display:block;width:100%;padding:15px;
  border-radius:12px;border:2px solid #A78BFA;cursor:pointer;
  font-size:16px;font-weight:700;letter-spacing:.02em;
  color:#ffffff !important;
  background:#7C3AED !important;
  box-shadow:0 4px 18px rgba(109,40,217,.65);
  margin-top:4px;
  transition:background .18s,color .18s,transform .1s;
}
button.btn-primary:hover,button.btn-primary:focus-visible{
  background:#ffffff !important;color:#000000 !important;border-color:#ffffff;
}
button.btn-primary:active{transform:scale(.97)}
button.btn-primary:disabled{opacity:.5;pointer-events:none}

.limit-note{font-size:12px;color:rgba(255,255,255,.35);text-align:center;margin-top:10px}
.rbadge{display:block;text-align:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#A78BFA;margin-bottom:6px;font-weight:600}
.rhint{font-size:12px;color:rgba(255,255,255,.4);text-align:center;margin-bottom:16px}

.scoreboard{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.pcard{
  background:rgba(10,6,20,.65);border:1.5px solid rgba(167,139,250,.2);
  border-radius:16px;padding:14px 16px;transition:border-color .2s;
}
.pcard.leader{border-color:rgba(167,139,250,.65);background:rgba(109,40,217,.28)}
.pcard.danger{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.12)}

.pcard-top{display:flex;align-items:center;gap:10px}
.pavatar{width:38px;height:38px;border-radius:50%;flex:none;background:#7C3AED;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.pcard.danger .pavatar{background:#DC2626}
.pinfo-wrap{flex:1;min-width:0}
.pname{font-size:15px;font-weight:600;color:#F0EEFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard.leader .pname{color:#C4B8FF}
.pcard.danger .pname{color:#FCA5A5}
.psublabel{font-size:11px;color:rgba(255,255,255,.38);margin-top:1px}
.pscore{font-size:32px;font-weight:700;color:#F0EEFF;font-variant-numeric:tabular-nums;line-height:1}
.pcard.leader .pscore{color:#C4B8FF}
.pcard.danger .pscore{color:#FCA5A5}

.pbar-wrap{height:4px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:10px}
.pbar{height:100%;border-radius:3px;background:rgba(255,255,255,.28);transition:width .4s ease}
.pcard.leader .pbar{background:#A78BFA}
.pcard.danger .pbar{background:#F87171}

.pentry{display:flex;align-items:center;gap:8px;margin-top:12px}
.pentry-label{font-size:11px;color:rgba(255,255,255,.4);flex:none;width:64px}
button.adj-btn{
  width:40px;height:40px;border-radius:10px;border:none;cursor:pointer;
  font-size:24px;font-weight:400;line-height:1;
  display:flex;align-items:center;justify-content:center;flex:none;
  color:#fff !important;transition:transform .1s,background .15s,color .15s;
}
button.adj-btn:active{transform:scale(.88)}
button.btn-minus{background:#EF4444 !important}
button.btn-minus:hover{background:#ffffff !important;color:#DC2626 !important}
button.btn-plus{background:#7C3AED !important}
button.btn-plus:hover{background:#ffffff !important;color:#7C3AED !important}
.round-input{
  flex:1;text-align:center;font-size:18px;font-weight:700;
  background:rgba(255,255,255,.12);border:1.5px solid rgba(167,139,250,.35);
  color:#F0EEFF;border-radius:10px;padding:8px 4px;margin:0;
}
.round-input.negative{color:#34D399;border-color:rgba(52,211,153,.55)}

.history{margin-top:20px;overflow-x:auto}
.hist-label{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;font-weight:600}
.hist-table{width:100%;border-collapse:collapse;font-size:13px}
.hist-table th{color:rgba(255,255,255,.32);font-weight:600;padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.07);text-align:center}
.hist-table th:first-child{text-align:left}
.hist-table td{text-align:center;padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.04);color:rgba(255,255,255,.55)}
.hist-table td:first-child{text-align:left;color:rgba(255,255,255,.28);white-space:nowrap}
.hist-table tfoot td{border-top:1px solid rgba(255,255,255,.1);border-bottom:none;color:#F0EEFF;padding-top:7px;font-weight:700}
.pos{color:#F87171}.neg{color:#34D399}

.winner-card{
  background:rgba(109,40,217,.28);border:1.5px solid rgba(167,139,250,.55);
  border-radius:18px;padding:28px 20px;text-align:center;margin-bottom:16px;
  animation:winPop .5s cubic-bezier(.2,1.4,.4,1);
}
@keyframes winPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.trophy{font-size:46px;margin-bottom:10px}
.winner-name{font-size:26px;font-weight:700;color:#C4B8FF;margin-bottom:4px}
.winner-sub{font-size:13px;color:rgba(255,255,255,.45)}

.buster-card{
  background:rgba(248,113,113,.15);border:1.5px solid rgba(248,113,113,.5);
  border-radius:14px;padding:16px 18px;text-align:center;margin-bottom:14px;
}
.buster-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#F87171;font-weight:700;margin-bottom:4px}
.buster-name{font-size:19px;font-weight:700;color:#FCA5A5}
.buster-sub{font-size:12px;color:rgba(252,165,165,.7);margin-top:2px}

.loser-row{
  background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);
  border-radius:12px;padding:12px 16px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;
}
.loser-name{font-size:14px;color:#C4B8F0;font-weight:600}
.loser-score{font-size:20px;font-weight:700;color:#C4B8F0}

.player-input{position:relative;margin-bottom:12px}
.player-input input{margin-bottom:0;padding-right:42px}
.pnum{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:12px;color:rgba(255,255,255,.3);font-weight:600}
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>
<div class="wrap">
  <div class="app-header">
    <div class="app-icon">&#9829;</div>
    <div class="app-title">Hearts Game</div>
    <div class="app-icon">&#9829;</div>
  </div>

  <div id="s-setup" class="screen active">
    <h2>How many players?</h2>
    <p class="sub">2 to 8 players supported</p>
    <input type="number" id="numPlayers" min="2" max="8" value="4" inputmode="numeric">
    <button class="btn-primary" onclick="setupNames()">Next &#8594;</button>
  </div>

  <div id="s-names" class="screen">
    <h2>Player names</h2>
    <p class="sub">Enter each player's name</p>
    <div id="nameFields"></div>
    <button class="btn-primary" onclick="startGame()">Start game</button>
    <p class="limit-note">First player to cross 50 loses &mdash; game ends, lowest score wins</p>
  </div>

  <div id="s-game" class="screen">
    <div class="rbadge" id="roundLabel"></div>
    <p class="rhint">Type each player's score for this round, then confirm once</p>
    <div class="scoreboard" id="scoreboard"></div>
    <button class="btn-primary" id="confirmBtn" onclick="confirmRound()"></button>
    <div class="history" id="history"></div>
  </div>

  <div id="s-end" class="screen">
    <h2>Game over</h2>
    <div class="winner-card">
      <div class="trophy">&#127942;</div>
      <div class="winner-name" id="winnerName"></div>
      <div class="winner-sub" id="winnerSub"></div>
    </div>
    <div class="buster-card" id="busterCard">
      <div class="buster-label">Busted 50</div>
      <div class="buster-name" id="busterName"></div>
      <div class="buster-sub" id="busterSub"></div>
    </div>
    <div id="finalStandings"></div>
    <br>
    <button class="btn-primary" onclick="resetGame()">New game</button>
  </div>
</div>

<script>
var players=[], completedRounds=0, LIMIT=50, submitting=false;

/* confetti */
var confettiRunning=false, confettiPieces=[], confettiEnd=0;
var COLORS=['#A78BFA','#7C3AED','#F87171','#FCD34D','#34D399','#60A5FA','#F472B6','#FFFFFF'];
function launchConfetti(){
  var canvas=document.getElementById('confetti-canvas');
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  confettiPieces=[];
  var n=Math.min(220,Math.floor(window.innerWidth/3));
  for(var i=0;i<n;i++){
    confettiPieces.push({
      x:Math.random()*canvas.width, y:-20-Math.random()*canvas.height*0.5,
      w:6+Math.random()*6, h:8+Math.random()*8,
      vy:2+Math.random()*3.5, vx:(Math.random()-0.5)*2,
      rot:Math.random()*Math.PI*2, vr:(Math.random()-0.5)*0.25,
      color:COLORS[Math.floor(Math.random()*COLORS.length)],
      sway:Math.random()*Math.PI*2
    });
  }
  confettiEnd=Date.now()+5000;
  if(!confettiRunning){ confettiRunning=true; confettiTick(); }
}
function confettiTick(){
  var canvas=document.getElementById('confetti-canvas');
  var ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  var now=Date.now(), alive=false;
  for(var i=0;i<confettiPieces.length;i++){
    var p=confettiPieces[i];
    p.sway+=0.05;
    p.x+=p.vx+Math.sin(p.sway)*0.8;
    p.y+=p.vy; p.rot+=p.vr;
    if(p.y<canvas.height+30){
      alive=true;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    } else if(now<confettiEnd){
      p.y=-20; p.x=Math.random()*canvas.width; alive=true;
    }
  }
  if(alive) requestAnimationFrame(confettiTick);
  else{ confettiRunning=false; ctx.clearRect(0,0,canvas.width,canvas.height); }
}

/* game */
function showScreen(id){
  var s=document.querySelectorAll('.screen');
  for(var i=0;i<s.length;i++) s[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
}

function setupNames(){
  var n=Math.min(8,Math.max(2,parseInt(document.getElementById('numPlayers').value,10)||4));
  var h='';
  for(var i=0;i<n;i++){
    h+='<div class="player-input"><input type="text" placeholder="Player '+(i+1)+'" data-pname autocomplete="off"><span class="pnum">'+(i+1)+'</span></div>';
  }
  document.getElementById('nameFields').innerHTML=h;
  showScreen('s-names');
  var first=document.querySelector('#nameFields input');
  if(first) first.focus();
}

function startGame(){
  var inputs=document.querySelectorAll('#nameFields input[data-pname]');
  if(!inputs.length){ setupNames(); return; }
  players=[];
  for(var i=0;i<inputs.length;i++){
    var v=(inputs[i].value||'').trim();
    players.push({name:v||('Player '+(i+1)),score:0,rounds:[]});
  }
  completedRounds=0; submitting=false;
  renderGame();
  showScreen('s-game');
}

function recalc(p){
  var t=0;
  for(var r=0;r<p.rounds.length;r++) t+=p.rounds[r];
  p.score=t;
}

function initials(name){
  var parts=name.split(' '), s='';
  for(var i=0;i<parts.length&&s.length<2;i++) if(parts[i]) s+=parts[i][0];
  return s.toUpperCase()||'?';
}

function renderGame(){
  var sorted=players.slice().sort(function(a,b){return a.score-b.score;});
  var leader=sorted[0];
  var html='';
  for(var si=0;si<sorted.length;si++){
    var p=sorted[si];
    var pidx=players.indexOf(p);
    var pct=Math.max(0,Math.min(100,Math.round(p.score/LIMIT*100)));
    var isLeader=p===leader&&players.length>1;
    var isDanger=p.score>=LIMIT*0.7;
    var cls=isDanger?'danger':(isLeader?'leader':'');
    html+='<div class="pcard '+cls+'">'
      +'<div class="pcard-top">'
      +'<div class="pavatar">'+initials(p.name)+'</div>'
      +'<div class="pinfo-wrap"><div class="pname">'+p.name+'</div>'
      +'<div class="psublabel">'+Math.max(0,LIMIT-p.score)+' pts before bust</div></div>'
      +'<div class="pscore">'+p.score+'</div>'
      +'</div>'
      +'<div class="pbar-wrap"><div class="pbar" style="width:'+pct+'%"></div></div>'
      +'<div class="pentry">'
      +'<span class="pentry-label">This round</span>'
      +'<button class="adj-btn btn-minus" onclick="bump('+pidx+',-1)" title="Decrease">&minus;</button>'
      +'<input class="round-input" type="number" id="rin'+pidx+'" value="0" inputmode="numeric" oninput="tint(this)">'
      +'<button class="adj-btn btn-plus" onclick="bump('+pidx+',1)" title="Increase">+</button>'
      +'</div></div>';
  }
  document.getElementById('scoreboard').innerHTML=html;
  var current=completedRounds+1;
  document.getElementById('roundLabel').textContent='\u2660 Round '+current+' \u2660';
  document.getElementById('confirmBtn').textContent='Confirm Round '+current;
  document.getElementById('confirmBtn').disabled=false;
  renderHistory();
}

function tint(el){
  var v=parseInt(el.value,10)||0;
  if(v<0) el.classList.add('negative'); else el.classList.remove('negative');
}

function bump(idx,dir){
  var inp=document.getElementById('rin'+idx);
  inp.value=(parseInt(inp.value,10)||0)+dir;
  tint(inp);
}

function confirmRound(){
  if(submitting) return;
  submitting=true;
  document.getElementById('confirmBtn').disabled=true;

  completedRounds++;
  for(var i=0;i<players.length;i++){
    var el=document.getElementById('rin'+i);
    var v=el?(parseInt(el.value,10)||0):0;
    players[i].rounds.push(v);
    recalc(players[i]);
  }
  /* Sudden death: anyone crossing 50 ends the game for everyone. */
  var busted=false;
  for(var i=0;i<players.length;i++) if(players[i].score>=LIMIT) busted=true;
  if(busted) endGame();
  else renderGame();
  submitting=false;
}

function renderHistory(){
  var maxR=0,i,r;
  for(i=0;i<players.length;i++) if(players[i].rounds.length>maxR) maxR=players[i].rounds.length;
  if(!maxR){ document.getElementById('history').innerHTML=''; return; }
  var cols='';
  for(i=0;i<players.length;i++) cols+='<th>'+players[i].name.split(' ')[0]+'</th>';
  var rows='';
  for(r=0;r<maxR;r++){
    var tds='';
    for(i=0;i<players.length;i++){
      var v=players[i].rounds[r];
      if(v===undefined) tds+='<td>&mdash;</td>';
      else if(v>0) tds+='<td><span class="pos">+'+v+'</span></td>';
      else if(v<0) tds+='<td><span class="neg">'+v+'</span></td>';
      else tds+='<td>0</td>';
    }
    rows+='<tr><td>R'+(r+1)+'</td>'+tds+'</tr>';
  }
  var totals='';
  for(i=0;i<players.length;i++) totals+='<td><strong>'+players[i].score+'</strong></td>';
  document.getElementById('history').innerHTML=
    '<div class="hist-label">Round history</div>'
    +'<table class="hist-table"><thead><tr><th></th>'+cols+'</tr></thead>'
    +'<tbody>'+rows+'</tbody>'
    +'<tfoot><tr><td>Total</td>'+totals+'</tr></tfoot></table>';
}

function endGame(){
  var sorted=players.slice().sort(function(a,b){return a.score-b.score;});
  var winner=sorted[0];
  var buster=sorted[sorted.length-1];

  document.getElementById('winnerName').textContent=winner.name;
  document.getElementById('winnerSub').textContent=
    'Lowest score \u2014 '+winner.score+' pts \u00B7 '+completedRounds+' round'+(completedRounds!==1?'s':'')+' played';

  document.getElementById('busterName').textContent=buster.name;
  document.getElementById('busterSub').textContent=buster.score+' pts \u2014 crossed the 50 limit';

  var html='';
  for(var i=1;i<sorted.length-1;i++){
    html+='<div class="loser-row"><span class="loser-name">'+sorted[i].name+'</span><span class="loser-score">'+sorted[i].score+'</span></div>';
  }
  document.getElementById('finalStandings').innerHTML=html;
  showScreen('s-end');
  launchConfetti();
}

function resetGame(){
  players=[]; completedRounds=0; submitting=false;
  document.getElementById('numPlayers').value=4;
  document.getElementById('nameFields').innerHTML='';
  showScreen('s-setup');
}
window.addEventListener('resize',function(){
  var c=document.getElementById('confetti-canvas');
  c.width=window.innerWidth; c.height=window.innerHeight;
});
</script>
</body>
</html>
